<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Sơ đồ hướng dẫn từ Cổng 1 (268 Lý Thường Kiệt) đến Hội trường A5">
  <defs>
    <linearGradient id="paperBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9f5eb"/>
      <stop offset="100%" stop-color="#efe6d2"/>
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d7263d"/>
    </marker>
  </defs>

  <rect width="640" height="360" rx="14" fill="url(#paperBg)"/>
  <!-- Grid subtle -->
  <g stroke="#e0d6bf" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
    <line x1="160" y1="0" x2="160" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
  </g>

  <!-- Ly Thuong Kiet street -->
  <rect x="0" y="294" width="640" height="44" fill="#d8cfbc"/>
  <line x1="0" y1="316" x2="640" y2="316" stroke="#f7f0e1" stroke-width="2" stroke-dasharray="14 10"/>
  <text x="320" y="321" text-anchor="middle" fill="#4b453a" font-family="sans-serif" font-size="13" font-weight="700" letter-spacing="2">ĐƯỜNG LÝ THƯỜNG KIỆT (268 LÝ THƯỜNG KIỆT)</text>

  <!-- Main Gate 1 -->
  <rect x="260" y="274" width="120" height="24" rx="5" fill="#0b1d3a"/>
  <text x="320" y="290" text-anchor="middle" fill="#e8b04a" font-family="monospace" font-size="12" font-weight="700">CỔNG 1 · BK</text>

  <!-- Campus buildings -->
  <rect x="48" y="130" width="125" height="90" rx="8" fill="#e4dac4" stroke="#c9bfa8" stroke-width="2"/>
  <text x="110" y="179" text-anchor="middle" fill="#6b6455" font-family="sans-serif" font-size="13" font-weight="700">Khu A1 - A2</text>

  <rect x="467" y="130" width="125" height="90" rx="8" fill="#e4dac4" stroke="#c9bfa8" stroke-width="2"/>
  <text x="530" y="179" text-anchor="middle" fill="#6b6455" font-family="sans-serif" font-size="13" font-weight="700">Sân Bách Khoa</text>

  <!-- Hoi truong A5 -->
  <rect x="200" y="42" width="240" height="106" rx="12" fill="#0b1d3a" stroke="#e8b04a" stroke-width="3"/>
  <text x="320" y="84" text-anchor="middle" fill="#e8b04a" font-family="monospace" font-size="13" font-weight="700" letter-spacing="1.5">ĐIỂM ĐẾN</text>
  <text x="320" y="112" text-anchor="middle" fill="#f7f0e1" font-family="sans-serif" font-size="22" font-weight="900">HỘI TRƯỜNG A5</text>
  <text x="320" y="133" text-anchor="middle" fill="#b7c2d6" font-family="sans-serif" font-size="12">Lễ Tốt nghiệp Khoa KH&amp;KT Máy tính</text>

  <!-- Pathway from Gate 1 to A5 -->
  <path d="M 320 272 L 320 162" fill="none" stroke="#d7263d" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#arrowRed)"/>

  <!-- Pin -->
  <circle cx="320" cy="148" r="7" fill="#d7263d" stroke="#fff" stroke-width="2"/>
  <rect x="342" y="198" width="150" height="32" rx="8" fill="#fff" stroke="#d7263d" stroke-width="1.5"/>
  <text x="417" y="218" text-anchor="middle" fill="#d7263d" font-family="sans-serif" font-size="12" font-weight="700">Đi thẳng vào Sảnh A5</text>
</svg>
